name: Execute AI Omnichannel Engine

on:
  schedule:
    # Triggers daily at 20:30 UTC (02:00 AM IST)
    - cron: '30 20 * * *'
  workflow_dispatch: 

jobs:
  run-ai-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure Python 3.12 Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        # Step 1: Install Google Libraries first to avoid grpcio conflict
        pip install google-api-core grpcio google-cloud-bigquery db-dtypes google-generativeai
        # Step 2: Install Data & ML Libraries
        pip install jupyter papermill pandas scikit-learn xgboost

    - name: Authenticate Google Cloud Platform (GCP)
      run: |
        echo "$GCP_CREDENTIALS" > gcp_key.json
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}

    - name: Execute Core AI Model (Headless Mode)
      env:
        GOOGLE_APPLICATION_CREDENTIALS: "gcp_key.json"
      run: |
        papermill ai_omnichannel_engine.ipynb execution_logs.ipynb
